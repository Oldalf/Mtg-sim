<mat-toolbar>
  <a class="app-name" routerLink="/">Goldfish</a>
  <nav aria-label="Places">
    @for (place of places; track place.path) {
      <a
        mat-button
        [routerLink]="place.path"
        routerLinkActive="is-active"
        ariaCurrentWhenActive="page"
      >
        {{ place.label }}
      </a>
    }
  </nav>
</mat-toolbar>
<main>
  <router-outlet />
</main>
