<button
  matIconButton
  (click)="togglePlay.emit()"
  [matTooltip]="isPlaying() ? 'Pause (space)' : 'Play (space)'"
  [attr.aria-label]="isPlaying() ? 'Pause' : 'Play'"
>
  <mat-icon>{{ isPlaying() ? 'pause' : 'play_arrow' }}</mat-icon>
</button>
<mat-button-toggle-group
  class="speed"
  [value]="speed()"
  (change)="chooseSpeed.emit($event.value)"
  aria-label="Autoplay speed"
  hideSingleSelectionIndicator
>
  @for (autoplaySpeed of AUTOPLAY_SPEEDS; track autoplaySpeed) {
    <mat-button-toggle [value]="autoplaySpeed">
      {{ autoplaySpeed }}
    </mat-button-toggle>
  }
</mat-button-toggle-group>
<button
  matIconButton
  (click)="step.emit('previousTurn')"
  matTooltip="Previous turn (left arrow)"
  aria-label="Previous turn"
>
  <mat-icon>keyboard_double_arrow_left</mat-icon>
</button>
<button
  matIconButton
  (click)="step.emit('previousLine')"
  matTooltip="Previous line (up arrow)"
  aria-label="Previous line"
>
  <mat-icon>chevron_left</mat-icon>
</button>
<button
  matIconButton
  (click)="step.emit('nextLine')"
  matTooltip="Next line (down arrow)"
  aria-label="Next line"
>
  <mat-icon>chevron_right</mat-icon>
</button>
<button
  matIconButton
  (click)="step.emit('nextTurn')"
  matTooltip="Next turn (right arrow)"
  aria-label="Next turn"
>
  <mat-icon>keyboard_double_arrow_right</mat-icon>
</button>

<div class="scrub">
  <div class="marks" aria-hidden="true">
    @for (tick of marks().turns; track tick.eventIndex) {
      <span
        class="turn-tick"
        [class.starts-round]="tick.startsRound"
        [style.left.%]="tick.percent"
      ></span>
    }
    @for (mark of marks().highlights; track mark.eventIndex) {
      <span class="highlight-mark" [style.left.%]="mark.percent"></span>
    }
  </div>
  <input
    type="range"
    min="0"
    [max]="eventCount() - 1"
    [value]="chosenEvent()"
    (input)="seekFromSlider($event)"
    aria-label="Position in the game"
    [attr.aria-valuetext]="turnTitle()"
  />
</div>

<span class="position">{{ chosenEvent() + 1 }} / {{ eventCount() }}</span>
<button
  matButton
  class="highlight-step"
  (click)="step.emit('previousHighlight')"
  matTooltip="Previous highlight (shift + h)"
  aria-label="Previous highlight"
>
  <mat-icon>arrow_back</mat-icon>
  <span class="label">Highlight</span>
</button>
<button
  matButton
  class="highlight-step"
  (click)="step.emit('nextHighlight')"
  matTooltip="Next highlight (h)"
  aria-label="Next highlight"
>
  <span class="label">Highlight</span>
  <mat-icon iconPositionEnd>arrow_forward</mat-icon>
</button>
<button
  matIconButton
  (click)="toggleLog.emit()"
  [matTooltip]="isLogOpen() ? 'Close the log (l)' : 'Open the log (l)'"
  [attr.aria-pressed]="isLogOpen()"
  aria-label="Log"
>
  <mat-icon>list</mat-icon>
</button>
