<table mat-table [dataSource]="shownRows()">
  <ng-container matColumnDef="label">
    <th mat-header-cell *matHeaderCellDef>{{ labelHeading() }}</th>
    <td mat-cell *matCellDef="let row">{{ row.label }}</td>
  </ng-container>

  @for (column of columns(); track $index; let columnIndex = $index) {
    <ng-container [matColumnDef]="'value' + columnIndex">
      <th mat-header-cell *matHeaderCellDef class="number">
        {{ column.label }}
      </th>
      <td mat-cell *matCellDef="let row" class="number">
        {{ row.cells[columnIndex].value }}
        @if (row.cells[columnIndex].difference; as difference) {
          <span
            class="difference"
            [class.is-noise]="!row.cells[columnIndex].isBeyondNoise"
          >
            {{ difference }}
          </span>
        }
      </td>
    </ng-container>
  }

  <tr mat-header-row *matHeaderRowDef="columnIds()"></tr>
  <tr mat-row *matRowDef="let row; columns: columnIds()"></tr>
</table>
